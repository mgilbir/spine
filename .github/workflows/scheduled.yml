# Scheduled deep checks: the race detector and the fuzz targets.
#
# Neither ran anywhere automatically before (C578). They are too slow for every
# push — `-race` multiplies both time and RSS, and the fuzz sweep runs 20+
# targets — so they run nightly instead, and on demand.
#
# On memory caps: CONTRIBUTING.md requires memory-hungry runs to go through a
# `systemd-run --user --scope`, because on a developer's machine a kernel OOM
# kill in the terminal's own cgroup tears the terminal down. A GitHub runner is
# a disposable VM, so the job itself is that isolation boundary — an OOM kill
# ends this job and nothing else. The cheap caps here are GOMEMLIMIT and a
# bounded -p, which keep the run inside the runner's memory rather than relying
# on the OOM killer at all. The corpus is not fetched, so cctest skips and the
# race run stays far below the local figures.
name: Scheduled

on:
  schedule:
    # 04:17 UTC daily — off the hour to avoid the scheduler's busiest minute.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The module gained its first requirement (golang.org/x/tools, for
          # internal/maporder) and so its first go.sum, which is what the
          # toolchain cache keys on. Caching is setup-go's default; it used to
          # be turned off here because there was no dependency file to find.

      - name: Fetch external fixtures
        run: make fetch

      # -p bounds concurrent package test binaries; GOMEMLIMIT makes each one
      # GC hard well before the runner's ceiling (race shadow memory sits
      # outside GC accounting, hence the conservative value).
      - name: Test with the race detector
        run: go test -race -p 2 ./... -count=1 -timeout 45m
        env:
          GOMEMLIMIT: 4GiB

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three format packages carry the most targets and the slowest
          # ones, so they get the longest slots.
          - pkg: docx
            fuzztime: 150s
          - pkg: xlsx
            fuzztime: 150s
          - pkg: pptx
            fuzztime: 150s
          - pkg: opc
            fuzztime: 120s
          - pkg: chart
            fuzztime: 120s
          - pkg: common/dml
            fuzztime: 120s
          - pkg: common/vml
            fuzztime: 120s
          - pkg: common/omml
            fuzztime: 120s
          - pkg: common/crypto
            fuzztime: 120s
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The module gained its first requirement (golang.org/x/tools, for
          # internal/maporder) and so its first go.sum, which is what the
          # toolchain cache keys on. Caching is setup-go's default; it used to
          # be turned off here because there was no dependency file to find.

      # Each package is its own job, so the packages fuzz in parallel and every
      # target gets minutes instead of the seconds it had when one job walked
      # all sixty of them inside a single hour.
      #
      # The budget matters more than it looks. The part-level targets build a
      # package, open it, save it and open it again, which costs so much that
      # the fuzzer manages about 11 executions a second — a thousand in a 45s
      # slot, barely past the seeds it was given. The parser-level targets run
      # at tens of thousands a second and reach millions in the same slot. Both
      # kinds are worth having, and neither is served by an equal share of one
      # hour.
      #
      # make fuzz-run still discovers targets at run time, so a new target in an
      # existing package is picked up with no edit here; a new *package* with
      # targets needs a line in the matrix.
      - name: Fuzz ${{ matrix.pkg }}
        run: make fuzz-run FUZZ_PKGS="${{ matrix.pkg }}" FUZZTIME=${{ matrix.fuzztime }}

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
