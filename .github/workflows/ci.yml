# Continuous integration: build, vet, test, and lint the module — the local
# merge gates from CONTRIBUTING.md (make build / vet / test / lint).
#
# What this job does NOT cover, stated plainly so a green check is not read as
# more than it is (C578):
#
#   - The Common Crawl corpus fidelity suite. Deliberate: it stays a
#     maintainer-run step (`make test-corpus`), and `go test ./cctest` skips
#     when the corpus is absent.
#   - The race detector and the fuzz targets. Both run on a schedule instead,
#     in .github/workflows/scheduled.yml — they are too slow for every push.
#   - Anything but linux/amd64. The library is pure Go with no build tags, but
#     path handling and file modes are only exercised on Ubuntu here.
#
# External fixtures ARE fetched below (`make fetch`, best-effort). Without that
# step every external-fixture test skipped in CI permanently, so a whole class
# of round-trip tests was advertised as covered and never ran.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the version declared in go.mod (go 1.25).
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Downloads the external round-trip fixtures. fetch.sh is best-effort by
      # design (a dead URL is reported and skipped), so this cannot brick the
      # run; without it, though, every test that needs one of those files skips
      # and CI silently covers less than it claims. Report what landed.
      - name: Fetch external fixtures
        run: |
          make fetch
          echo "--- fetched fixtures ---"
          find . -path '*/testdata/external/*' -type f | sort

      - name: Vet
        run: go vet ./...

      # The RC4 CryptoAPI cross-validation test drives msoffcrypto-tool as an
      # independent reference implementation. Without a Python that can import
      # it, that test skips — so the cross-validation the docs advertise runs
      # nowhere. Install it here and set SPINE_REQUIRE_MSOFFCRYPTO on the test
      # step so a missing or broken install fails instead of skipping silently.
      - name: Set up Python (RC4 cross-validation reference)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install msoffcrypto-tool
        run: python -m pip install --disable-pip-version-check msoffcrypto-tool

      # Runs the full suite. cctest skips without the corpus (expected);
      # the corpus is never fetched in CI.
      - name: Test
        run: go test ./... -count=1
        env:
          SPINE_REQUIRE_MSOFFCRYPTO: "1"

      # golangci-lint v2.x is required by .golangci.yml; the action's v8
      # major line installs v2. Version pinned to match the maintainer's
      # working toolchain (baseline is zero issues).
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...
